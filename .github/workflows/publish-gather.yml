name: Publish Gather updates
on:
  push:
    branches: [main]
    paths:
      - 'gather-updates/parts/**'
      - 'gather-updates/split/**'
      - 'gather-updates/update-ui.js'
      - 'gather-updates/feature-v061.js'
      - 'gather-updates/smart-pantry-v07.js'
      - 'gather-updates/shopping-guide-v08.js'
      - 'gather-updates/wizard-v09.js'
      - 'gather-updates/diagnostics-v097.js'
      - 'gather-updates/clean-shell-v10.js'
      - 'gather-updates/cooking-guide-v11.js'
      - 'gather-updates/photo-editor-v13.js'
      - 'gather-updates/photo-catalog-v131.js'
      - 'gather-updates/photo-source-map.json'
      - 'gather-updates/smoke-test.cjs'
      - '.github/workflows/publish-gather.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check gather-updates/feature-v061.js
          node --check gather-updates/smart-pantry-v07.js
          node --check gather-updates/shopping-guide-v08.js
          node --check gather-updates/wizard-v09.js
          node --check gather-updates/diagnostics-v097.js
          node --check gather-updates/clean-shell-v10.js
          node --check gather-updates/cooking-guide-v11.js
          node --check gather-updates/photo-editor-v13.js
          node --check gather-updates/photo-catalog-v131.js
          node --check gather-updates/update-ui.js
      - name: Assemble and validate update
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('gather-updates')
          pieces=[]
          for i in range(21):
              base=root/'parts'/f'{i:03d}.txt'
              if base.exists(): pieces.append(base.read_bytes())
              else:
                  pieces.append(b''.join((root/'split'/f'{i:03d}-{j}.txt').read_bytes() for j in range(3)))
          html=b''.join(pieces).decode('utf-8')
          # Repair legacy global function shadowing that caused infinite recursion.
          html=html.replace('function renderPlan(){originalPlan();','function renderPlanEnhanced(){originalPlan();')
          html=html.replace('originalRenderAll();renderPlan();renderShopping()','originalRenderAll();renderPlanEnhanced();renderShopping()')
          script=(root/'update-ui.js').read_text()
          script=script.replace('APP_VERSION="1.3.2"','APP_VERSION="1.3.2"')
          if '</body>' not in html: raise SystemExit("Missing body")
          feature=(root/'feature-v061.js').read_text()
          smart=(root/'smart-pantry-v07.js').read_text()
          shopping=(root/'shopping-guide-v08.js').read_text()
          wizard=(root/'wizard-v09.js').read_text()
          diagnostics=(root/'diagnostics-v097.js').read_text()
          clean=(root/'clean-shell-v10.js').read_text()
          cooking=(root/'cooking-guide-v11.js').read_text()
          photo_editor=(root/'photo-editor-v13.js').read_text()
          photo_catalog=(root/'photo-catalog-v131.js').read_text()
          html=html.replace('</body>','<script>'+script+'</script><script>'+feature+'</script><script>'+smart+'</script><script>'+shopping+'</script><script>'+wizard+'</script><script>'+diagnostics+'</script><script>'+clean+'</script><script>'+cooking+'</script><script>'+photo_editor+'</script><script>'+photo_catalog+'</script></body>')
          if 'GATHER / YOUR PERSONAL CHEF' not in html or 'id="settings"' not in html: raise SystemExit("Invalid app")
          # Embed category food photos so the iPhone does not need a network image request.
          import re,base64,urllib.request
          photo_urls=sorted(set(re.findall(r'https://images[.]unsplash[.]com/photo-[A-Za-z0-9-]+(?:[?]w=[0-9]+)?',html)))
          for image_url in photo_urls:
              try:
                  req=urllib.request.Request(image_url.split('?')[0]+'?w=320&h=240&fit=crop&q=55&fm=jpg',headers={'User-Agent':'GatherApp/1.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      image_bytes=response.read(450001)
                  if len(image_bytes)>450000 or len(image_bytes)<4000: continue
                  data_uri='data:image/jpeg;base64,'+base64.b64encode(image_bytes).decode('ascii')
                  html=html.replace(image_url,data_uri)
                  print('Embedded photo',image_url[:65],len(image_bytes))
              except Exception as exc:
                  print('Unable to embed photo:',image_url,str(exc))
          # Convert per-recipe photo URLs into compact offline JPEG assets embedded in the app.
          from PIL import Image
          from io import BytesIO
          source_map=json.loads((root/'photo-source-map.json').read_text())
          photo_map={}
          for recipe_id,photo_url in source_map.items():
              try:
                  if not photo_url.startswith('https://d8j0ntlcm91z4.cloudfront.net/'):
                      raise ValueError("Untrusted photo host")
                  req=urllib.request.Request(photo_url,headers={'User-Agent':'GatherApp/1.2'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read(9000001)
                  if len(raw)>9000000: raise ValueError("Image too large")
                  im=Image.open(BytesIO(raw)).convert('RGB')
                  im.thumbnail((440,330),Image.Resampling.LANCZOS)
                  out=BytesIO();im.save(out,format='JPEG',quality=78,optimize=True)
                  photo_map[recipe_id]='data:image/jpeg;base64,'+base64.b64encode(out.getvalue()).decode('ascii')
                  print('Ready unique photo',recipe_id,len(out.getvalue()))
              except Exception as exc:
                  raise RuntimeError(f'Unable to embed {recipe_id} photo: {exc}')
          bootstrap='window.GATHER_MEAL_PHOTOS='+json.dumps(photo_map,separators=(',',':'))+';'
          html=html.replace('<script>'+clean+'</script>','<script>'+bootstrap+'</script><script>'+clean+'</script>')
          if len(photo_map)!=len(source_map): raise RuntimeError("Incomplete photo map")
          payload=html.encode('utf-8')
          (root/'index.html').write_bytes(payload)
          feed={"version":"1.3.2","html_url":"https://raw.githubusercontent.com/davidstapleton2308/earned-home-mapper/main/gather-updates/index.html","sha256":hashlib.sha256(payload).hexdigest(),"min_wrapper_version":"0.5.0"}
          (root/'manifest.json').write_text(json.dumps(feed,indent=2)+'\n')
          print("Published HTML:",len(payload),"SHA256:",feed['sha256'])
          PY
      - name: Test meal planner in real browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          node gather-updates/smoke-test.cjs
      - name: Commit update feed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add gather-updates/index.html gather-updates/manifest.json
          if ! git diff --cached --quiet; then git commit -m "Publish Gather v0.5.1 interface and update manifest"; git push; fi
