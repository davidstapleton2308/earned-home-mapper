<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1315"><meta name="apple-mobile-web-app-capable" content="yes"><title>Earned · Home Mapper V3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1315;color:#edf5f0}*{box-sizing:border-box}body{margin:0}main{margin:auto;max-width:800px;padding:22px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;padding:7px 0 22px}.brand{font-size:13px;font-weight:850;letter-spacing:3px;color:#b9f5b1}h1{font-size:29px;letter-spacing:-1px;margin:5px 0 13px}h2{font-size:19px;margin:5px 0 12px}h3{font-size:15px;margin:6px 0}p{font-size:14px;color:#aec2bb;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.card{border-radius:19px;background:#152529;border:1px solid #304542;padding:17px;margin:12px 0}.soft{background:#1b302e;padding:13px;border-radius:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stack{display:grid;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:16px;text-align:left;background:#17292a;border:1px solid #385248;border-radius:16px;color:#fff;min-height:98px}.tile strong{display:block;margin:9px 0 4px}.tile small{color:#a8c6b9}.btn{padding:12px 15px;border-radius:12px;border:1px solid #45645a;background:#1d332f;color:#f1faf3;font-weight:650}.primary{background:#b8efae;border-color:#b8efae;color:#102117;font-weight:800}.tiny{font-size:12px;padding:8px 10px}.pill{border-radius:99px;color:#b7eeb2;background:#234332;font-size:11px;padding:7px 10px;white-space:nowrap}.muted,small{color:#a8beb5;font-size:12px}.progress{height:7px;border-radius:9px;background:#314b42;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#aeebad}label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #446158;border-radius:10px;background:#0d1b1c;color:#fff;padding:12px}textarea{min-height:90px}input[type=file]{max-width:100%;font-size:12px}.q{border:1px solid #2b4741;background:#1a3030;padding:13px;border-radius:14px;margin:10px 0}.choice{padding:9px 12px;border:1px solid #527369;border-radius:10px;background:#213a35;color:white;margin:4px 5px 4px 0}.choice.active{background:#b8efae;color:#112119}.nav{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:center;background:#0d1b1ff5;border-top:1px solid #29453b;padding:10px 14px max(14px,env(safe-area-inset-bottom));gap:6px}.nav button{max-width:170px;flex:1}.notice{border-left:3px solid #e2b97b;padding:9px 13px;background:#312b25;border-radius:8px;color:#f6dbc2;font-size:12px}.media{display:grid;gap:7px;margin:10px 0}.entry{padding:10px;border-radius:11px;background:#213633;display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{background:#30453e;border-radius:8px;padding:4px 7px;font-size:11px;color:#c6ded0}hr{border:0;border-top:1px solid #334843;margin:17px 0}.hidden{display:none} .tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 16px}.tabs button{white-space:nowrap}.tabs .sel{background:#b8efae;color:#14251c}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main id="app"></main><div class="nav" id="nav"><button class="btn tiny" onclick="go('home')">⌂ Spaces</button><button class="btn tiny" onclick="go('review')">✓ Review</button><button class="btn tiny" onclick="go('backup')">⇩ Backup</button></div>
<script>
'use strict';
const presets=[['Entrance / open plan','entry'],['Kitchen','kitchen'],['Living room','living'],['Hallway','hall'],['Primary bedroom','bed'],['Second bedroom','bed'],['Bathroom 1','bath'],['Bathroom 2','bath'],['Laundry room','laundry'],['Patio','patio'],['Utilities / HVAC','utility'],['Vehicle','vehicle']];
const commonZones=['Overview / layout','Ceiling / lights / fans','Walls / doors / trim','Windows / blinds','Floor / baseboards','Furniture / movable objects','Storage / hidden areas'];
const extraZones={entry:['Entry flooring / storage'],kitchen:['Sink / faucet','Counters / backsplash','Stovetop / oven','Refrigerator / freezer','Cabinets / drawers','Pantry / food storage','Trash / recycling','Under sink'],living:['TV / electronics','Seating / textiles','Under furniture'],hall:['Doors / switches'],bed:['Bedding / mattress','Closet interior','Under bed','Dressers / drawers'],bath:['Toilet','Shower / tub / grout','Vanity / sink','Mirror','Bathroom closet','Exhaust / ventilation','Plumbing / drains'],laundry:['Washer / tub','Dryer / lint trap','Vents / connections','Detergents / storage'],patio:['Railings / doors','Drainage / outdoor floor','Outdoor furniture / plants'],utility:['HVAC unit / returns','Filter access / dimensions','Alarms / detectors','Water / electrical utilities'],vehicle:['Seats / upholstery','Floor mats / footwells','Console / storage','Cargo area / trunk']};
const qBank={base:[['occupants','How many people normally use this space?',['1','2','3+','Unknown']],['use','How often is this area used?',['Daily','Several times weekly','Rarely','Unknown']],['material','Main floor material?',['Tile','Vinyl / laminate','Wood','Carpet','Other / unsure']]],kitchen:[['cooking','How often do you cook here?',['Daily','3–5 days/week','1–2 days/week','Rarely']],['dishwasher','Is there a dishwasher?',['Yes','No','Broken / unused']],['dishload','How quickly do dirty dishes accumulate?',['Same day','Every 2–3 days','Less often','Unsure']],['trash','Where is kitchen trash kept?',['Under sink','Freestanding','Cabinet','Other']]],living:[['tv','How many televisions in this room?',['0','1','2+']],['pets','Do pets spend time here?',['Yes','No']],['dust','How quickly does dust collect?',['Fast','Average','Slow','Unsure']]],entry:[['shoes','Are shoes stored here?',['Yes','No']],['traffic','How much foot traffic?',['High','Moderate','Low']]],hall:[['storage','Are there closets or storage here?',['Yes','No']]],bed:[['sleep','Is this room slept in regularly?',['Daily','Occasionally','No']],['closet','Does this bedroom have a closet?',['Yes','No']],['laundry','Do clothes often accumulate here?',['Yes','No','Sometimes']]],bath:[['shower','Is the shower/tub regularly used?',['Daily','Several times weekly','Rarely','No shower']],['water','Any hard-water or mold-like buildup noticed?',['Yes','No','Unsure']],['linen','Is there a linen or storage closet here?',['Yes','No']]],laundry:[['appliance','What laundry appliances are present?',['Washer + dryer','Washer only','Dryer only','None']],['loads','How many laundry loads per week?',['0–1','2–3','4–6','7+']],['dryer','Does dryer vent outdoors?',['Yes','No','Unsure']]],patio:[['furniture','Is there outdoor furniture?',['Yes','No']],['plant','Any plants or planters?',['Yes','No']],['exposure','Main patio exposure?',['Covered','Partially covered','Open']]],utility:[['ac','What HVAC system is installed?',['Central','Window / portable','Other','Unsure']],['filter','Do you know the HVAC filter size?',['Yes','No','No replaceable filter known']],['maint','Who handles HVAC service?',['Me','Landlord / association','Unsure']]],vehicle:[['vehicle','Do you store things inside your vehicle?',['Often','Sometimes','Rarely']],['clean','How often is vehicle cleaned?',['Weekly','Monthly','Rarely']]]};
const app=document.querySelector('#app'); let view='home',roomId=null,roomTab='inspect';let db;let state={version:3,created:new Date().toISOString(),rooms:presets.map((p,i)=>({id:'room-'+i,name:p[0],kind:p[1],zones:[...commonZones,...(extraZones[p[1]]||[])].map((z,j)=>({id:'z'+j,name:z,done:false,notes:''})),answers:{},objects:[],notes:''}))};
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const rid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);const room=()=>state.rooms.find(r=>r.id===roomId);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('earned-home-mapper-v3',1);req.onupgradeneeded=()=>{let d=req.result;d.createObjectStore('data');d.createObjectStore('media',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function op(store,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),s=t.objectStore(store);let req=fn(s);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function save(){await op('data','readwrite',s=>s.put(state,'home'));}async function mediaAll(){return op('media','readonly',s=>s.getAll());}async function mediaRoom(id){return (await mediaAll()).filter(m=>m.roomId===id);}async function addMedia(files,kind){let accepted=0;for(const f of files){if(f.size>70*1024*1024){alert('File too large ('+Math.round(f.size/1048576)+'MB). Keep each clip under 70 MB and use short clips.');continue;}const obj={id:rid(),roomId,kind,name:f.name||kind+'-'+Date.now(),type:f.type||'application/octet-stream',date:new Date().toISOString(),blob:f};await op('media','readwrite',s=>s.put(obj));accepted++;}render();alert(accepted+' file(s) saved on this device.');}
function go(v,id){view=v;if(id)roomId=id;render()}function stats(){let total=state.rooms.reduce((n,r)=>n+r.zones.length,0),done=state.rooms.reduce((n,r)=>n+r.zones.filter(z=>z.done).length,0);return{total,done}}function header(sub){return `<header><span class="brand">E A R N E D / M A P P E R</span><span class="pill">PRIVATE FIRST · V3</span></header><div class="muted">${esc(sub||'')}</div>`}
function home(){const s=stats();app.innerHTML=header('Discover your home, one verified zone at a time')+`<h1>Your home, understood.</h1><div class="card"><div class="row"><b>Inspection coverage</b><b>${s.done}/${s.total}</b></div><div class="progress"><div style="width:${s.done/s.total*100}%"></div></div><p>Rooms are not considered fully mapped until all zones are checked and outstanding questions are reviewed.</p></div><div class="grid">${state.rooms.map(r=>{let n=r.zones.filter(z=>z.done).length;return `<button class="tile" onclick="go('room','${r.id}')"><span>⌂</span><strong>${esc(r.name)}</strong><small>${n}/${r.zones.length} zones inspected</small></button>`}).join('')}</div><div class="card"><h3>Missing a space?</h3><input id="newname" type="text" placeholder="e.g. Linen closet / Pantry / Garage"><button class="btn" style="margin-top:9px" onclick="addRoom()">+ Add space</button></div>`;}
async function addRoom(){let name=document.querySelector('#newname').value.trim();if(!name)return;state.rooms.push({id:rid(),name,kind:'base',zones:commonZones.map((z,j)=>({id:'z'+j,name:z,done:false,notes:''})),answers:{},objects:[],notes:''});await save();render();}
function switchTab(t){roomTab=t;render()}
async function renderRoom(){let r=room();if(!r){go('home');return}let md=await mediaRoom(roomId);app.innerHTML=header('Room inspection')+`<button class="btn tiny" onclick="go('home')">← All spaces</button><h1>${esc(r.name)}</h1><div class="row"><span class="muted">${r.zones.filter(z=>z.done).length}/${r.zones.length} inspection zones completed</span><span class="pill">${md.length} media</span></div><div class="tabs">${[['inspect','Inspect'],['interview','Interview'],['inventory','Inventory'],['capture','Capture'],['notes','Notes']].map(t=>`<button class="btn tiny ${roomTab===t[0]?'sel':''}" onclick="switchTab('${t[0]}')">${t[1]}</button>`).join('')}</div><div id="roomBody"></div>`;
let body=document.querySelector('#roomBody');if(roomTab==='inspect')body.innerHTML=`<p>Inspect every area, including closed storage, under furniture, ceilings and corners. Only mark a zone when you've actually examined it.</p>${r.zones.map((z,i)=>`<div class="q"><label style="margin:0"><input type="checkbox" ${z.done?'checked':''} onchange="toggleZone(${i},this.checked)"> ${esc(z.name)}</label><textarea placeholder="Describe what is here, surfaces, condition, and anything still unknown" onchange="zoneNote(${i},this.value)">${esc(z.notes)}</textarea></div>`).join('')}`;
if(roomTab==='interview'){let questions=[...(qBank.base||[]),...(qBank[r.kind]||[])];body.innerHTML=`<p>Answer by tapping; use the microphone on your iPhone keyboard for longer free-form answers. If unavailable, you can record voice in Capture.</p>${questions.map(([key,q,options])=>`<div class="q"><h3>${esc(q)}</h3>${options.map(o=>`<button class="choice ${r.answers[key]===o?'active':''}" onclick="answer('${key}',${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}<textarea placeholder="Optional voice-dictated explanation" onchange="answerNote('${key}',this.value)">${esc(r.answers[key+'Note']||'')}</textarea></div>`).join('')}`;}
if(roomTab==='inventory')body.innerHTML=`<p>Add meaningful objects and materials. You don't need to list every spoon or shirt.</p><div class="card"><label>Object / area</label><input id="itemName" type="text" placeholder="e.g. Ceiling fan, closet shelf"><label>Material or model (optional)</label><input id="itemMaterial" type="text" placeholder="e.g. Painted wood, vinyl, model number"><label>Location / condition / upkeep details</label><textarea id="itemNotes" placeholder="e.g. Over sofa. Dust builds up monthly."></textarea><button class="btn primary" onclick="addObject()">Save object</button></div>${r.objects.map(o=>`<div class="entry"><div><b>${esc(o.name)}</b><div class="muted">${esc(o.material)} · ${esc(o.notes)}</div></div><button class="btn tiny" onclick="removeObject('${o.id}')">Remove</button></div>`).join('')}`;
if(roomTab==='capture')body.innerHTML=`<p>Record short, narrated walkthroughs and detailed photos. Media stays on-device until you export it.</p><div class="card"><h3>Photos</h3><input id="photos" type="file" accept="image/*" capture="environment" multiple><button class="btn" onclick="upload('photos','photo')">Save selected photos</button></div><div class="card"><h3>Video walkthrough</h3><p>Use short clips (ideally 20–45 seconds). Say the object names and locations out loud. Keep individual clips below 70 MB.</p><input id="videos" type="file" accept="video/*" capture="environment"><button class="btn" onclick="upload('videos','video')">Save video</button></div><div class="card"><h3>Audio narration</h3><p>Record your spoken notes. The browser may request microphone permission.</p><div class="row wrap"><button id="recBtn" class="btn" onclick="startAudio()">● Record</button><button class="btn" onclick="stopAudio()">■ Stop & save</button></div><div class="muted" id="recStatus">Not recording</div></div><h3>Saved evidence (${md.length})</h3>${md.map(m=>`<div class="entry"><div><b>${esc(m.kind)}</b><div class="muted">${esc(m.name)} · ${(m.blob.size/1048576).toFixed(1)} MB</div></div><div class="row"><button class="btn tiny" onclick="previewMedia('${m.id}')">View</button><button class="btn tiny" onclick="deleteMedia('${m.id}')">×</button></div></div>`).join('')}<div id="preview"></div>`;
if(roomTab==='notes')body.innerHTML=`<p>Document household habits, unexpected features, accessibility restrictions, cleaning supplies and follow-up questions.</p><textarea id="roomNotes" style="min-height:180px" onchange="changeNotes(this.value)">${esc(r.notes)}</textarea><p class="notice">Always inspect utility systems safely. Do not remove electrical panels or access unsafe spaces to complete your map.</p>`;
}
async function toggleZone(i,val){room().zones[i].done=val;await save();render()}async function zoneNote(i,val){room().zones[i].notes=val;await save()}async function answer(key,val){room().answers[key]=val;await save();render()}async function answerNote(key,val){room().answers[key+'Note']=val;await save()}async function changeNotes(v){room().notes=v;await save()}async function addObject(){let n=document.querySelector('#itemName').value.trim();if(!n)return;room().objects.push({id:rid(),name:n,material:document.querySelector('#itemMaterial').value,notes:document.querySelector('#itemNotes').value,origin:'user-confirmed'});await save();render()}async function removeObject(id){if(!confirm('Remove this inventory entry?'))return;room().objects=room().objects.filter(o=>o.id!==id);await save();render()}
async function upload(id,kind){let e=document.getElementById(id);if(!e.files.length)return alert('Choose a file or record one first.');await addMedia([...e.files],kind)}async function deleteMedia(id){if(!confirm('Delete this recording from the mapper?'))return;await op('media','readwrite',s=>s.delete(id));render()}async function previewMedia(id){let m=await op('media','readonly',s=>s.get(id));const url=URL.createObjectURL(m.blob);document.getElementById('preview').innerHTML=`<div class="card">${m.type.startsWith('image')?`<img src="${url}" style="max-width:100%;border-radius:12px">`:m.type.startsWith('video')?`<video src="${url}" controls playsinline style="max-width:100%"></video>`:`<audio src="${url}" controls></audio>`}</div>`;}
let recorder,recorded=[],stream;async function startAudio(){if(recorder&&recorder.state==='recording')return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);recorded=[];recorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};recorder.onstop=async()=>{let b=new Blob(recorded,{type:recorder.mimeType||'audio/webm'});await addMedia([new File([b],`narration-${Date.now()}.${b.type.includes('mp4')?'m4a':'webm'}`,{type:b.type})],'audio');stream.getTracks().forEach(t=>t.stop());};recorder.start();document.querySelector('#recStatus').textContent='Recording…';}catch(e){alert('Microphone recording unavailable: '+e.message+'; use the iPhone camera/audio recorder and import the recording instead.')}}function stopAudio(){if(recorder?.state==='recording'){recorder.stop();let el=document.querySelector('#recStatus');if(el)el.textContent='Saving…';}}
function review(){let s=stats();let unanswered=state.rooms.map(r=>({r,n:[...(qBank.base||[]),...(qBank[r.kind]||[])].filter(q=>!r.answers[q[0]]).length}));app.innerHTML=header('Coverage, unanswered questions and missing evidence')+`<h1>Review your map</h1><div class="card"><h2>${s.done} / ${s.total} zones inspected</h2><div class="progress"><div style="width:${s.done/s.total*100}%"></div></div><p>Check unanswered questions and media before exporting. Checked zones still require honest physical inspection.</p></div>${unanswered.map(({r,n})=>`<div class="entry"><div><b>${esc(r.name)}</b><div class="muted">${r.zones.filter(z=>!z.done).length} zones not inspected · ${n} questions unanswered · ${r.objects.length} inventory objects</div></div><button class="btn tiny" onclick="roomTab='inspect';go('room','${r.id}')">Open</button></div>`).join('')}`;}
// Self-contained ZIP using stored (uncompressed) entries so no CDN or server is required.
const te=new TextEncoder(),td=new TextDecoder();let crcTable=Array.from({length:256},(_,i)=>{let c=i;for(let j=0;j<8;j++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;return c>>>0});function crc32(a){let c=0xffffffff;for(let x of a)c=crcTable[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0;}function u16(v,n,x){v.setUint16(n,x,true)}function u32(v,n,x){v.setUint32(n,x>>>0,true)}
function zip(files){let parts=[],central=[],offset=0;for(let f of files){const n=te.encode(f.name),bytes=f.bytes,crc=crc32(bytes);let l=new Uint8Array(30+n.length),v=new DataView(l.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x800);u16(v,8,0);u32(v,14,crc);u32(v,18,bytes.length);u32(v,22,bytes.length);u16(v,26,n.length);l.set(n,30);parts.push(l,bytes);let c=new Uint8Array(46+n.length),w=new DataView(c.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u16(w,8,0x800);u32(w,16,crc);u32(w,20,bytes.length);u32(w,24,bytes.length);u16(w,28,n.length);u32(w,42,offset);c.set(n,46);central.push(c);offset+=l.length+bytes.length;}let centralLength=central.reduce((n,c)=>n+c.length,0),e=new Uint8Array(22),w=new DataView(e.buffer);u32(w,0,0x06054b50);u16(w,8,files.length);u16(w,10,files.length);u32(w,12,centralLength);u32(w,16,offset);return new Blob([...parts,...central,e],{type:'application/zip'});}
function unzip(bytes){let out={},dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),p=0;while(p+4<bytes.length){const sig=dv.getUint32(p,true);if(sig===0x02014b50||sig===0x06054b50)break;if(sig!==0x04034b50)throw Error('Unknown ZIP entry');let flags=dv.getUint16(p+6,true),method=dv.getUint16(p+8,true),crc=dv.getUint32(p+14,true),len=dv.getUint32(p+18,true),nl=dv.getUint16(p+26,true),xl=dv.getUint16(p+28,true);if(method!==0||(flags&8))throw Error('ZIP uses unsupported compression/options');let name=td.decode(bytes.subarray(p+30,p+30+nl)),start=p+30+nl+xl,end=start+len;if(end>bytes.length||crc32(bytes.subarray(start,end))!==crc)throw Error('Corrupt media in '+name);out[name]=bytes.slice(start,end);p=end;}return out;}
function fileName(n){return n.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,90)}async function exportZip(target){let rooms=target==='all'?state.rooms:state.rooms.filter(r=>r.id===target);let media=(await mediaAll()).filter(m=>rooms.some(r=>r.id===m.roomId));let total=media.reduce((s,m)=>s+m.blob.size,0);if(total>120*1048576){alert('This export is '+Math.round(total/1048576)+'MB. Export individual rooms, or use shorter video clips to avoid Safari memory limits.');return;}const data={schema:'earned-home-v3',exported:new Date().toISOString(),rooms,media:media.map(m=>({id:m.id,roomId:m.roomId,kind:m.kind,name:m.name,type:m.type,date:m.date,path:`media/${m.id}_${fileName(m.name)}`}))};let entries=[{name:'home.json',bytes:te.encode(JSON.stringify(data,null,2))},{name:'README.txt',bytes:te.encode('Earned Home Mapper V3 backup. Do not publish or share without reviewing personal media. Import this ZIP using the app Backup page.')}];for(let m of media){entries.push({name:`media/${m.id}_${fileName(m.name)}`,bytes:new Uint8Array(await m.blob.arrayBuffer())});}let b=zip(entries);try{let parsed=unzip(new Uint8Array(await b.arrayBuffer()));if(Object.keys(parsed).length!==entries.length)throw Error('Entry count differs');for(let entry of entries)if(!parsed[entry.name])throw Error('Missing '+entry.name);}catch(e){alert('Export verification failed: '+e.message);return;}download(b,`Earned_Home_${target==='all'?'Complete':fileName(rooms[0].name)}_${new Date().toISOString().slice(0,10)}.zip`);document.querySelector('#exportStatus').textContent='ZIP verified locally: '+entries.length+' entries, '+(b.size/1048576).toFixed(1)+' MB. Save this file in Files/iCloud Drive.';}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function importZip(e){const f=e.files[0];if(!f)return;try{let ent=unzip(new Uint8Array(await f.arrayBuffer()));if(!ent['home.json'])throw Error('Missing home.json');let payload=JSON.parse(td.decode(ent['home.json']));if(payload.schema!=='earned-home-v3'||!Array.isArray(payload.rooms)||!Array.isArray(payload.media))throw Error('Not a valid V3 backup');for(let m of payload.media)if(!ent[m.path])throw Error('Missing '+m.name);if(!confirm('Import '+payload.rooms.length+' rooms? Matching room IDs will replace current records. Media with matching IDs will replace existing media. Export your current data first if needed.'))return;for(let r of payload.rooms){let i=state.rooms.findIndex(x=>x.id===r.id);if(i>=0)state.rooms[i]=r;else state.rooms.push(r);}for(let m of payload.media){let bytes=ent[m.path];let blob=new Blob([bytes],{type:m.type});await op('media','readwrite',s=>s.put({...m,blob}));}await save();alert('Restore complete: '+payload.rooms.length+' rooms, '+payload.media.length+' media files.');go('review');}catch(error){alert('Restore failed: '+error.message+'\nNo files from this import were accepted unless import was confirmed.')}}
function backup(){app.innerHTML=header('Export, verify and restore your home map')+`<h1>Protect your work.</h1><div class="notice">Local browser storage can be lost if Safari data is cleared, the app is removed, or iOS evicts website data. Export after each room. Avoid storing sensitive IDs or documents in footage.</div><div class="card"><h2>Export a verified ZIP</h2><p>Room-sized archives are safer for iPhone video. The exporter checks file integrity before offering the ZIP.</p><label>Select export</label><select id="exportChoice"><option value="all">Entire home (small collections only)</option>${state.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn primary" style="margin-top:12px" onclick="exportZip(document.querySelector('#exportChoice').value)">Export ZIP</button><p id="exportStatus" class="muted"></p></div><div class="card"><h2>Restore an export</h2><p>Select a ZIP from an earlier Home Mapper V3 export. Existing matching rooms will be replaced after confirmation.</p><input type="file" accept=".zip,application/zip" onchange="importZip(this)"></div><div class="card"><h3>Small media test first</h3><p>Record one photo and a short clip, export the room, open the ZIP in Files, then import the ZIP. Verify both records and media survive before documenting every room.</p></div>`}
function render(){if(view==='home')home();if(view==='room')renderRoom();if(view==='review')review();if(view==='backup')backup();}async function init(){try{db=await openDB();let old=await op('data','readonly',s=>s.get('home'));if(old?.version===3)state=old;else await save();render()}catch(err){app.innerHTML='<h1>Storage unavailable</h1><p>Open in Safari over HTTPS and allow local website storage. '+esc(err.message)+'</p>';}}init();
</script></body></html>
